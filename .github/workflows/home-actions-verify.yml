name: Home actions verification
on:
  push:
    branches: [feat/home-pdf-record-locks]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests
        run: node --test mobile-v4/tests/*.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: home-actions-source
          path: |
            mobile-v4
            index.html
            supabase
          retention-days: 2
