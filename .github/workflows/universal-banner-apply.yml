name: Universal banner validation
on:
  push:
    branches: [feat/universal-offer-banner]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image and apply exact reviewed integration
        run: python .github/banner-transfer/integrate.py
      - name: Run all regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test mobile-v4/tests/*.cjs | tee /tmp/banner-tests.txt
      - name: Fetch existing pinned PDF libraries for isolated browser verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/banner-vendor
          curl --fail --location --retry 2 https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js -o /tmp/banner-vendor/html2canvas.min.js
          curl --fail --location --retry 2 https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js -o /tmp/banner-vendor/jspdf.umd.min.js
      - name: Commit tested integration on feature branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r .github/banner-transfer .github/workflows/universal-banner-apply.yml
          git add mobile-v4 index.html
          git commit -m 'Apply approved universal banner without double text or cropped artwork'
          git push origin HEAD:feat/universal-offer-banner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: universal-banner-verification
          path: |
            mobile-v4
            index.html
            /tmp/banner-tests.txt
            /tmp/banner-vendor
          retention-days: 2
